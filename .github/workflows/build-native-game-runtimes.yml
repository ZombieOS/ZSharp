name: Build native game runtimes

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            runtime: stage/bin/zsharp.exe
            python_asset: cpython-3.13.15%2B20260901-x86_64-pc-windows-msvc-install_only_stripped.tar.gz
            python_sha256: 63d263ab0162f34a241a56dc5b283c22d6e131f5516117e6a921350c69ba7d4f
          - platform: windows-aarch64
            runner: windows-11-arm
            runtime: stage/bin/zsharp.exe
            python_asset: cpython-3.13.15%2B20260901-aarch64-pc-windows-msvc-install_only_stripped.tar.gz
            python_sha256: 8b31e1ddae9ebd339eae0549049546aa54484dbf92c81694b1e7510fee869413
          - platform: linux-x86_64
            runner: ubuntu-24.04
            runtime: stage/bin/zsharp
            python_asset: cpython-3.13.15%2B20260901-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
            python_sha256: 8a689a077337bea6d1c4bc0b7df1d52fcaa28f5f67e50df8bf417c1e3f9d8874
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            runtime: stage/bin/zsharp
            python_asset: cpython-3.13.15%2B20260901-aarch64-unknown-linux-gnu-install_only_stripped.tar.gz
            python_sha256: 01ce0ce9189feaead3298abf10d4efe998c55a489b3d5d38ca4f83dda7e7977e
          - platform: macos-x86_64
            runner: macos-15-intel
            runtime: stage/bin/zsharp
            python_asset: cpython-3.13.15%2B20260901-x86_64-apple-darwin-install_only_stripped.tar.gz
            python_sha256: f712a9143c8a5d248438ec7921a0b48d548bca4f1337d33c690d28c2d0504137
          - platform: macos-aarch64
            runner: macos-15
            runtime: stage/bin/zsharp
            python_asset: cpython-3.13.15%2B20260901-aarch64-apple-darwin-install_only_stripped.tar.gz
            python_sha256: d3904bd6a072246e07aa0bdadee9a14e80521e42a943c0848059feb16a2816dc

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SDL Linux build dependencies
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config ninja-build
          libasound2-dev libpulse-dev libaudio-dev libfribidi-dev
          libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
          libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev
          libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Configure native runtime
        shell: pwsh
        run: |
          $arguments = @(
            "-S", ".",
            "-B", "build-native",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DBUILD_TESTING=OFF",
            "-DZSHARP_BUILD_GAME_RUNTIME=ON"
          )
          if ("${{ matrix.platform }}".StartsWith("macos-")) {
            $arguments += "-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"
          }
          cmake @arguments

      - name: Build and install native runtime
        shell: pwsh
        run: |
          cmake --build build-native --config Release --parallel
          cmake --install build-native --config Release --prefix stage

      - name: Verify the game runtime
        shell: pwsh
        run: |
          & "${{ matrix.runtime }}" --version
          if ($LASTEXITCODE -ne 0) { throw "ZVM version check failed" }
          & "${{ matrix.runtime }}" game-info
          if ($LASTEXITCODE -ne 0) { throw "game runtime is unavailable" }

      - name: Bundle the Python runtime
        shell: pwsh
        run: |
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/${{ matrix.python_asset }}"
          Invoke-WebRequest -Uri $url -OutFile python-download.tar.gz
          $actual = (Get-FileHash python-download.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "${{ matrix.python_sha256 }}") {
            throw "The pinned Python runtime checksum did not match"
          }
          New-Item -ItemType Directory -Path build/python-runtime -Force | Out-Null
          tar -xzf python-download.tar.gz -C build/python-runtime
          Copy-Item native/python/zsharp_bridge.py build/python-runtime/python/zsharp_bridge.py -Force
          tar -czf stage/bin/python-runtime.tar.gz -C build/python-runtime python

      - name: Stage checksummed runtime files
        shell: pwsh
        run: |
          $support = @()
          $moltenVk = "stage/bin/libMoltenVK.dylib"
          if (Test-Path -LiteralPath $moltenVk -PathType Leaf) {
            $support += $moltenVk
          }
          $support += "stage/bin/python-runtime.tar.gz"
          & ./scripts/stage-native-runtime.ps1 `
            -Platform "${{ matrix.platform }}" `
            -Runtime "${{ matrix.runtime }}" `
            -Support $support
          $artifactRoot = "build/runtime-artifact"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          Copy-Item -Recurse -Force `
            "java/src/main/resources/META-INF/zsharp/runtime/${{ matrix.platform }}" `
            $artifactRoot

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: zsharp-runtime-${{ matrix.platform }}
          path: build/runtime-artifact
          if-no-files-found: error
